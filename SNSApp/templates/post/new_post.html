{% extends "base.html" %}

{% block title %}ユーザー投稿画面{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/new_post.css') }}">
{% endblock %}

{% block content %}

<main class="new-post">

    <form method="POST" enctype="multipart/form-data">
        <!-- 商品名 -->
        <div class="form-group">

            <label for="product_name">商品名</label>
            <input
                type="text"
                id="product_name"
                name="product_name"
            >
        </div>

        <!-- 店舗・価格 -->
        <div class="form-row">

            <div class="form-group">
                <label for="store_id">店舗</label>
                <select id="store_id" name="store_id">
                    <option value="">▼ 選択してください</option>
                    <option value="1">ローソン</option>
                    <option value="2">ナチュラルローソン</option>
                    <option value="3">ファミリーマート</option>
                    <option value="4">セブンイレブン</option>
                    <option value="5">ミニストップ</option>
                    <option value="6">デイリーヤマザキ</option>
                    <option value="7">まいばすけっと</option>
                </select>
            </div>

            <div class="form-group">
                <label for="price">価格（円）</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                >
            </div>
        </div>

        <!-- カロリー・糖分 -->
        <div class="form-row">

            <div class="form-group">
                <label for="calories">カロリー (kcal) </label>
                <input
                    type="number"
                    id="calories"
                    name="calories"
                >
            </div>

            <div class="form-group">
                <label for="sugar">糖分 (g) </label>
                <input
                    type="number"
                    id="sugar"
                    name="sugar"
                    step="0.1"
                >
            </div>

        </div>

        <!-- 商品画像 -->
         <div class="form-group">
            <label for="image">商品画像</label>
            <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
            >
         </div>

         <!-- コメント -->
        <div class="form-group">
            <label for="comment">コメント</label>

            <textarea
                id="comment"
                name="comment"
                placeholder="「商品のおすすめポイント(味、栄養素...)をお書きください"
            ></textarea>
        </div>

        <!-- ボタン -->
         <div class="form-buttons">

            <button type="button" class="cancel-button">
                キャンセル
            </button>

            <button type="submit" class="post-button">
                投稿
            </button>

            <button type="button" class="draft-button">
                一時保存
            </button>
               
         </div>
    </form>
</main>
{% endblock %}
